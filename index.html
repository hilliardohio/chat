<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hilliard Assistant — City of Hilliard, Ohio</title>
<style>
  :root{
    --navy:#1b3a5c; --navy-dark:#12293f; --green:#2e7d4f; --gold:#e8b84b;
    --bg:#f4f6f8; --card:#ffffff; --text:#1d2b36; --muted:#5c6b78; --border:#dde4ea;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
  header{background:var(--navy);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:14px;flex-shrink:0}
  header .seal{width:38px;height:38px;border-radius:50%;background:var(--gold);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
  header h1{font-size:17px;font-weight:700}
  header .sub{font-size:12px;opacity:.8}
  main{flex:1;overflow:hidden;display:flex;justify-content:center}
  .pane{width:100%;max-width:820px;height:100%;display:flex;flex-direction:column;padding:16px}
  #chatScroll{flex:1;overflow-y:auto;padding:8px 4px}
  .msg{max-width:78%;margin:8px 0;padding:11px 15px;border-radius:14px;line-height:1.5;font-size:14.5px;white-space:pre-wrap;word-wrap:break-word}
  .msg.user{background:var(--navy);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
  .msg.bot{background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .msg.bot a{color:var(--navy);font-weight:600}
  .msg .tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--green);margin-bottom:5px}
  .disclaimer{text-align:center;font-size:11.5px;color:var(--muted);padding:6px 0 2px}
  #inputRow{display:flex;gap:8px;padding-top:10px}
  #chatInput{flex:1;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-size:14.5px;outline:none;resize:none;font-family:inherit;background:#fff}
  #chatInput:focus{border-color:var(--navy)}
  #sendBtn{background:var(--green);color:#fff;border:none;border-radius:10px;padding:0 22px;font-size:14.5px;font-weight:600;cursor:pointer}
  #sendBtn:disabled{opacity:.5;cursor:default}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:6px 0}
  .chips button{background:#fff;border:1px solid var(--border);border-radius:16px;padding:5px 12px;font-size:12.5px;cursor:pointer;color:var(--navy)}
  .chips button:hover{border-color:var(--navy)}
  .typing{color:var(--muted);font-style:italic;font-size:13px;padding:6px 4px}
  .letter{background:#fbfcfd;border:1px solid var(--border);border-left:4px solid var(--navy);border-radius:8px;padding:12px 14px;margin:10px 0;font-size:13px}
  .letter .lt{font-weight:800;color:var(--navy);font-size:13.5px;letter-spacing:.3px;margin-bottom:2px}
  .printBtn{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:12.5px;font-weight:600;cursor:pointer;margin-top:4px}
  @media (max-width:640px){ .msg{max-width:92%} header h1{font-size:14px} }
</style>
</head>
<body>

<header>
  <div class="seal">H</div>
  <div>
    <h1>Hilliard Assistant <span id="staffBadge" style="display:none;font-size:11px;font-weight:600;vertical-align:middle;padding:2px 7px;border-radius:10px;background:rgba(255,255,255,.22);letter-spacing:.03em">STAFF VIEW</span></h1>
    <div class="sub">City of Hilliard, Ohio — resident information</div>
  </div>
</header>

<main>
  <section class="pane">
    <div id="chatScroll"></div>
    <div class="chips" id="chips">
      <button onclick="ask('When is my trash picked up?')">Trash pickup</button>
      <button onclick="ask('Do I need a permit for a fence?')">Fence permits</button>
      <button onclick="ask('What are the noise ordinance quiet hours?')">Noise rules</button>
      <button onclick="ask('What is the city income tax rate and how do I file?')">Income tax</button>
      <button onclick="ask('How do I contact the police for a non-emergency?')">Police</button>
      <button onclick="ask('What is the zoning for 3800 Municipal Way?')">Zoning by address</button>
      <button onclick="ask('How big is the property at 3993 Cosgray Rd and who owns it?')">Property info</button>
      <button onclick="ask('How do I see the permits that have been issued for my property?')">Permit history</button>
      <button onclick="ask('Can I get a zoning letter for 3800 Municipal Way?')">Zoning letter</button>
      <button onclick="ask('Zoning research: I want to research a property or development in Hilliard. Explain what you can look up — the zoning district and map for any address or landmark, Franklin County Auditor property details, permit history, and the City\'s Planning &amp; Zoning application history (rezonings, PUDs, plats, variances, conditional uses) searchable by project name, application type, or keyword — then ask me for the address, project name, or keyword to research.')">Zoning research</button>
    </div>
    <div id="inputRow">
      <textarea id="chatInput" rows="1" placeholder="Ask a question about City of Hilliard services, rules, or contacts…"></textarea>
      <button id="sendBtn" onclick="send()">Send</button>
    </div>
    <div id="staffToggleRow" style="display:flex;align-items:center;gap:6px;margin:6px 2px 0;font-size:12px;color:#5c6b78">
      <label style="display:inline-flex;align-items:center;gap:5px;cursor:pointer">
        <input type="checkbox" id="staffToggle" onchange="setStaffMode(this.checked)" style="margin:0;cursor:pointer">
        <span>Staff mode — link OpenGov records to the internal record view (City staff login required)</span>
      </label>
    </div>
    <div class="disclaimer">Automated informational assistant — not legal advice. Verify with the City at (614) 876-7361 or hilliardohio.gov.</div>
  </section>
</main>

<script>
"use strict";

/* ======== CONFIGURE: set this to your Cloudflare Worker URL (no trailing slash) ======== */
const BACKEND = 'https://hilliard-assistant.ralley.workers.dev';
/* ======================================================================================= */

let topics = [];
let history = [];

/* ---------- topics (fetched from backend; customized in /admin) ---------- */
async function loadTopics(){
  try{
    const r = await fetch(BACKEND + '/api/config');
    const d = await r.json();
    if(Array.isArray(d.topics)) topics = d.topics;
  }catch(e){ /* fall back to no customizations */ }
}
function matchTopics(question){
  return topics.filter(t => t.enabled !== false && String(t.keywords||'').split(',')
    .map(k => k.trim()).filter(Boolean)
    .some(k => new RegExp('\\b' + k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\b','i').test(question)));
}

/* ---------- topic tagging for the log ---------- */
const CATS = [
  ["Trash/Recycling","trash,recycl,garbage,yard waste,bulk,bin,pickup,compost,chipper"],
  ["Taxes","tax,rita,filing"],
  ["Permits/Building","permit,fence,shed,deck,build,contractor,inspection,zoning,variance"],
  ["Parks/Rec","park,pool,swim,the well,recreation,trail,shelter,camp,fitness"],
  ["Police/Court","police,court,ticket,crash,records,crime,officer"],
  ["Code/Ordinance","noise,curfew,firework,chicken,dog,cat,animal,grass,weed,sign,parking,garage sale,home occupation,ordinance,code"],
  ["Utilities","water,sewer,electric,gas,aep,columbia,columbus"],
  ["Government","council,city manager,mayor,meeting,vote,board,commission"],
  ["Snow/Streets","snow,plow,pothole,leaf,leaves,street,sidewalk,salt"],
  ["Events","event,festival,parade,tree lighting,trick or treat,beggar,dora"],
  ["Jobs","job,employment,hiring,career,lifeguard"],
  ["Records","public record,records request"]
];
function categorize(q, matched){
  if(matched.length) return matched[0].name;
  const s = q.toLowerCase();
  for(const [name, kws] of CATS){ if(kws.split(',').some(k => s.includes(k))) return name; }
  return "Other";
}

/* ---------- GIS zoning lookup (runs in the visitor's browser) ---------- */
const GIS = {
  parcels: 'https://maps.hilliardohio.gov/arcgis/rest/services/FranklinCoImports/Franklin_County_Parcel_Features/FeatureServer/1/query',
  zoning:  'https://maps.hilliardohio.gov/arcgis/rest/services/Hosted/Zoning_Districts_Public_View/FeatureServer/10/query',
  // Franklin County's live parcel service (authoritative & current — the City layer above
  // is a periodic import that lags recent sales/ownership changes). Used to refresh the
  // property details (owner, last transfer, acreage, year built) by parcel ID.
  countyParcels: 'https://gis.franklincountyohio.gov/hosting/rest/services/ParcelFeatures/Parcel_Features/MapServer/0/query'
};
// Pull the current Franklin County Auditor attributes for a parcel id (or null on failure).
async function countyParcelDetails(pid){
  if(!pid) return null;
  try{
    const d = await gisQuery(GIS.countyParcels, {
      where: "PARCELID='" + String(pid).replace(/'/g,"''") + "'",
      outFields: 'PARCELID,SITEADDRESS,CVTTXDSCRP,SCHLDSCRP,OWNERNME1,OWNERNME2,PRPRTYDSCRP3,RESYRBLT,SALEDATE,SALEPRICE,PCLASS,CNVYNAME,HOMSTD,ACRES',
      returnGeometry: 'false', resultRecordCount: '1'
    });
    return (d.features && d.features[0]) ? d.features[0].attributes : null;
  }catch(e){ return null; }
}
// Route a GIS URL through the Worker (used when the visitor's network/browser blocks the
// direct call — corporate DNS/TLS filters, VPNs, privacy extensions).
function gisViaProxy(fullUrl){ return BACKEND + '/api/gis?u=' + encodeURIComponent(fullUrl); }
async function gisQuery(url, params){
  const full = url + '?' + new URLSearchParams({f:'json', ...params});
  let d = null, directErr = null;
  try{
    const r = await fetch(full);
    if(!r.ok) throw new Error('GIS server returned ' + r.status);
    d = await r.json();
  }catch(e){
    // Direct call blocked/failed — retry server-side through the Worker.
    directErr = e;
    try{
      const r2 = await fetch(gisViaProxy(full));
      if(!r2.ok) throw new Error('GIS proxy returned ' + r2.status);
      d = await r2.json();
    }catch(e2){
      throw new Error('could not reach the City GIS service from this network (' + (directErr.message || 'blocked') + ')');
    }
  }
  if(d && d.error) throw new Error('GIS: ' + (d.error.message || JSON.stringify(d.error)));
  return d;
}
function normalizeAddress(addr){
  return addr.toUpperCase().replace(/[.,#]/g,' ')
    .replace(/\b(HILLIARD|COLUMBUS|OHIO|OH|USA)\b.*$/,'')
    .replace(/\b\d{5}(-\d{4})?\b/g,'')
    .replace(/\s+/g,' ').trim();
}
const PARCEL_FIELDS = 'PARCELID,SITEADDRESS,CVTTXDSCRP,SCHLDSCRP,OWNERNME1,OWNERNME2,PRPRTYDSCRP3,RESYRBLT,SALEDATE,SALEPRICE,PCLASS,CNVYNAME,HOMSTD,Shape__Area';
const PARCEL_SUFFIX = ['RD','ROAD','DR','DRIVE','ST','STREET','AVE','AVENUE','AV','LN','LANE','CT','COURT','BLVD','BOULEVARD','WAY','WY','CIR','CIRCLE','PL','PLACE','PKWY','PARKWAY','SQ','SQUARE','TRL','TRAIL','LOOP','RUN','XING','CROSSING'];
function addressPatterns(address){
  const norm = normalizeAddress(String(address || ''));
  const m = norm.match(/^(\d+)\s+(.+)$/);
  if(!m) return null;
  const num = m[1], words = m[2].split(' ');
  const core = words.filter(w => !PARCEL_SUFFIX.includes(w)).join(' ');
  return [...new Set([num+' '+words.join(' '), num+' '+core, num+' '+words[0]])];
}
// The street portion of an address, normalized for comparison (suffix words dropped).
// "47800 LACON RD" -> "LACON"; used to reject geocoder matches on a different street.
function streetKeyOf(address){
  const norm = normalizeAddress(String(address || ''));
  const m = norm.match(/^(\d+)\s+(.+)$/);
  const words = (m ? m[2] : norm).split(' ').filter(w => w && !PARCEL_SUFFIX.includes(w)
    && !['N','S','E','W','NORTH','SOUTH','EAST','WEST'].includes(w));
  return words.join(' ');
}
// When a house number isn't on file, report the numbers that DO exist on that street so the
// resident can correct a typo — instead of silently matching a parcel somewhere else.
async function streetNumberRange(address){
  const street = streetKeyOf(address);
  if(!street || street.length < 3) return null;
  try{
    const d = await gisQuery(GIS.parcels, {
      where: "SITEADDRESS LIKE '% " + street.replace(/'/g,"''") + "%'",
      outFields: 'SITEADDRESS', returnGeometry: 'false', resultRecordCount: '1000'
    });
    const addrs = (d.features || []).map(f => String(f.attributes.SITEADDRESS || ''))
      .filter(a => streetKeyOf(a) === street);
    if(!addrs.length) return null;
    const nums = addrs.map(a => parseInt(a, 10)).filter(n => !isNaN(n));
    const name = (addrs[0].match(/^\d+\s+(.+)$/) || [,addrs[0]])[1];
    return nums.length ? { street: name, low: Math.min(...nums), high: Math.max(...nums), count: addrs.length } : null;
  }catch(e){ return null; }
}
// Match a parcel from an address string that has a house number (City parcel layer).
async function parcelByAddress(address){
  const patterns = addressPatterns(address);
  if(!patterns) return null;
  for(const pat of patterns){
    const d = await gisQuery(GIS.parcels, {
      where: "SITEADDRESS LIKE '" + pat.replace(/'/g,"''") + "%'",
      outFields: PARCEL_FIELDS, returnCentroid: 'true', returnGeometry: 'false', outSR: '4326', resultRecordCount: '5'
    });
    if(d.features && d.features.length) return d.features;
  }
  return null;
}
// Match a parcel by a lon/lat point (WGS84) via spatial intersect (City parcel layer).
async function parcelByPoint(lon, lat){
  const d = await gisQuery(GIS.parcels, {
    geometry: lon+','+lat, geometryType:'esriGeometryPoint', inSR:'4326', spatialRel:'esriSpatialRelIntersects',
    outFields: PARCEL_FIELDS, returnCentroid: 'true', returnGeometry: 'false', outSR: '4326', resultRecordCount: '3'
  });
  return (d.features && d.features.length) ? d.features : null;
}
// Franklin County's live parcel layer (county-wide, authoritative) as a fallback when the
// City's import has no match. It doesn't return centroids, so compute one from the geometry.
const COUNTY_FIELDS = 'PARCELID,SITEADDRESS,CVTTXDSCRP,SCHLDSCRP,OWNERNME1,OWNERNME2,PRPRTYDSCRP3,RESYRBLT,SALEDATE,SALEPRICE,PCLASS,CNVYNAME,HOMSTD,ACRES';
function withCentroid(feats){
  return (feats || []).map(f => {
    if(!f.centroid && f.geometry && f.geometry.rings && f.geometry.rings.length){
      let xs = 0, ys = 0, n = 0;
      for(const ring of f.geometry.rings) for(const pt of ring){ xs += pt[0]; ys += pt[1]; n++; }
      f.centroid = n ? { x: xs/n, y: ys/n } : null;
    }
    return f;
  });
}
async function countyParcelByAddress(address){
  const patterns = addressPatterns(address);
  if(!patterns) return null;
  for(const pat of patterns){
    try{
      const d = await gisQuery(GIS.countyParcels, {
        where: "SITEADDRESS LIKE '" + pat.replace(/'/g,"''") + "%'",
        outFields: COUNTY_FIELDS, returnGeometry: 'true', outSR: '4326', resultRecordCount: '5'
      });
      if(d.features && d.features.length) return withCentroid(d.features);
    }catch(e){}
  }
  return null;
}
async function countyParcelByPoint(lon, lat){
  try{
    const d = await gisQuery(GIS.countyParcels, {
      geometry: lon+','+lat, geometryType:'esriGeometryPoint', inSR:'4326', spatialRel:'esriSpatialRelIntersects',
      outFields: COUNTY_FIELDS, returnGeometry: 'true', outSR: '4326', resultRecordCount: '3'
    });
    return (d.features && d.features.length) ? withCentroid(d.features) : null;
  }catch(e){ return null; }
}
// Search the Planning & Zoning application master list (served by the Worker from the published CSV).
async function searchProjectsViaWorker(q){
  try{ return await fetch(BACKEND + '/api/projects?q=' + encodeURIComponent(q || '')).then(r => r.json()); }
  catch(e){ return { unavailable: true, reason: e.message }; }
}
// Resolve a place/business/landmark name (or fuzzy address) to a point via the Worker's geocoder.
async function geocodePlace(q){
  try{ const g = await fetch(BACKEND + '/api/geocode?q=' + encodeURIComponent(q)).then(r=>r.json()); return (g && !g.error && g.lat) ? g : null; }
  catch(e){ return null; }
}
// City's public interactive zoning map — the "New Zoning Map" web map, whose top layer is the
// Planning service (Zoning Districts + PUD Plans and Standards) over the City aerial basemap.
const ZONING_WEBMAP = 'https://maps.hilliardohio.gov/portal/apps/mapviewer/index.html?webmap=16422dcdae2749929b88fde5f947f90b';
// Static zoning-map image (City "Hilliard" map service: Zoning Districts + Tax Parcels + labels),
// a deep link that opens this parcel on the live Zone Lookup map, and the full-map link.
function zoningMapUrls(lon, lat){
  const dlon = 0.0030, dlat = 0.0017; // ~1,700 x 1,250 ft window (4:3)
  const bbox = [lon-dlon, lat-dlat, lon+dlon, lat+dlat].map(v => v.toFixed(6)).join(',');
  const pt = lon.toFixed(6) + ',' + lat.toFixed(6);
  return {
    image_url: 'https://maps.hilliardohio.gov/arcgis/rest/services/Hilliard/MapServer/export?bbox=' + bbox +
      '&bboxSR=4326&imageSR=102723&size=480,360&format=png&layers=show:5,3,16&transparent=false&f=image',
    live_map_url: ZONING_WEBMAP + '&center=' + pt + '&level=18',
    full_map_url: ZONING_WEBMAP,
    note: 'The red dot marks the property on the map image; clicking the image opens the City zoning map centered on this parcel.'
  };
}
/* Zoning district -> its name and the exact place in the Hilliard code where that
   classification is established, so the letter can link the classification itself.
   Chapters 1109/1111/1113/1115/1117 are codified on Municode; the Community Development
   districts (Chapter 1116) are not yet codified and live in adopting Ordinance 25-17. */
const MUNI_CODE = 'https://library.municode.com/oh/hilliard/codes/code_of_ordinances?nodeId=';
const MUNI_ORD  = 'https://library.municode.com/oh/hilliard/ordinances/code_of_ordinances?nodeId=';
const CH1109 = MUNI_CODE + 'PTELEVENPLZOCO_CH1109REDI';
const CH1111 = MUNI_CODE + 'PTELEVENPLZOCO_CH1111BUDI';
const CH1113 = MUNI_CODE + 'PTELEVENPLZOCO_CH1113INDI';
const CH1115 = MUNI_CODE + 'PTELEVENPLZOCO_CH1115SPPUDI';
const CH1117 = MUNI_CODE + 'PTELEVENPLZOCO_CH1117PLUNDEDI';
const CH1116 = MUNI_ORD  + '1369718';
const ZONE_INFO = {
  'R-R':  ['Rural Residential District', CH1109], 'R-1': ['Low Density Residential District', CH1109],
  'R-2':  ['Low/Medium Density Residential District', CH1109], 'R-3': ['Moderate Density Residential District', CH1109],
  'R-4':  ['High Density Residential District', CH1109],
  'B-1':  ['Neighborhood Business District', CH1111], 'B-2': ['Community Business District', CH1111],
  'B-3':  ['Office/Institutional District', CH1111], 'B-4': ['I-270 Corridor Business District', CH1111],
  'B-4-I-270': ['I-270 Corridor Business District', CH1111],
  'M-1':  ['Restricted Industrial District', CH1113], 'M-2': ['General Industrial District', CH1113],
  'S-1':  ['Support Facilities District', CH1115], 'HCD': ['Hilliard Conservation District', CH1115],
  'OH-MD':['Old Hilliard Mixed Use District', CH1115], 'OH-RD': ['Old Hilliard Residential District', CH1115],
  'PUD':  ['Planned Unit Development District', CH1117],
  'DE':   ['Big Darby Employment District (Community Development District, §1116.07)', CH1116],
  'I-1':  ['I-270 Corridor District, I-1 Natural subdistrict (§1116.08)', CH1116],
  'I-3':  ['I-270 Corridor District, I-3 Suburban subdistrict (§1116.08)', CH1116],
  'I-6':  ['I-270 Corridor District, I-6 Urban Core subdistrict (§1116.08)', CH1116],
  'I-FE': ['I-270 Corridor District, I-FE Flex Employment subdistrict (§1116.08)', CH1116],
  'I-MR': ['I-270 Corridor District, I-MR Mill Run subdistrict (§1116.08)', CH1116],
  'Civic':['I-270 Corridor District, Civic subdistrict (§1116.08)', CH1116]
};
function zoneInfo(code){
  const k = String(code || '').trim();
  const hit = ZONE_INFO[k] || ZONE_INFO[k.toUpperCase()]
    || ZONE_INFO[Object.keys(ZONE_INFO).find(z => z.toUpperCase() === k.toUpperCase()) || ''];
  return hit ? { district_name: hit[0], code_url: hit[1] } : {};
}
// Direct link to a parcel's profile on the Franklin County Auditor site (pin = parcel digits + "00").
function auditorLink(pid){
  const d = String(pid || '').replace(/\D/g, '');
  if(!d) return 'https://property.franklincountyauditor.com/_web/search/commonsearch.aspx?mode=address';
  return 'https://property.franklincountyauditor.com/_web/Datalets/Datalet.aspx?mode=profileall&UseSearch=no&pin=' + (d.length === 9 ? d + '00' : d);
}
window.lastZoning = null;
async function lookupZoning(address){
  // Clear first: a stale result from an earlier address must never supply the map for this one.
  window.lastZoning = null;
  try{
    let feats = await parcelByAddress(address);
    let resolved_place, found_via = 'City of Hilliard parcel layer';
    // Does the query look like a street address (house number + street name)? If so, the
    // geocoder must land on THAT street — otherwise it will happily return the same house
    // number on a different road, and the letter would describe the wrong property.
    const wantStreet = addressPatterns(address) ? streetKeyOf(address) : '';
    const sameStreet = (fs) => !wantStreet || (fs || []).some(f => streetKeyOf(f.attributes.SITEADDRESS) === wantStreet);
    if(!feats){
      // No direct address match — try resolving a place/business/landmark name.
      const g = await geocodePlace(address);
      if(g){
        if(g.streetAddress) feats = await parcelByAddress(g.streetAddress);
        if(!feats) feats = await parcelByPoint(g.lon, g.lat);
        if(feats && !sameStreet(feats)) feats = null; // geocoder drifted to another street
        if(feats){
          found_via = 'geocoded place name';
          resolved_place = { query: String(address), resolved_address: g.streetAddress || feats[0].attributes.SITEADDRESS, note: 'resolved from a place/landmark name via public geocoder — confirm it is the intended property' };
        } else {
          // Not in the City layer — check Franklin County Auditor records at that point.
          feats = await countyParcelByPoint(g.lon, g.lat);
          if(feats && !sameStreet(feats)) feats = null;
          if(feats) found_via = 'Franklin County Auditor records (address not in the City parcel layer)';
        }
      }
    }
    if(!feats){
      // Last resort: search Franklin County Auditor records county-wide by address.
      feats = await countyParcelByAddress(address);
      if(feats) found_via = 'Franklin County Auditor records (address not in the City parcel layer)';
    }
    if(!feats){
      // Never substitute a different property. Say the address wasn't found, and — when the
      // street exists in Hilliard — show the house numbers that are on file for it.
      const range = await streetNumberRange(address);
      let msg = 'No parcel matches "' + address + '" in City of Hilliard or Franklin County Auditor records, so no zoning information can be provided for it.';
      if(range) msg += ' ' + range.street + ' does exist in Hilliard, but the addresses on file run from ' + range.low + ' to ' + range.high + ' (' + range.count + ' parcels) — please check the house number.';
      msg += ' Do NOT substitute a different property or guess. Ask the resident to confirm the address, or point them to the Franklin County Auditor address search at property.franklincountyauditor.com/_web/search/commonsearch.aspx?mode=address, or the Planning Division at (614) 334-2366.';
      return { error: msg, address_not_found: true, street_on_file: range || undefined };
    }
    const p = feats[0], c = p.centroid;
    if(!c) return {error:'Found the parcel but could not determine its map location.'};
    const z = await gisQuery(GIS.zoning, {
      geometry: c.x + ',' + c.y, geometryType: 'esriGeometryPoint', inSR: '4326',
      spatialRel: 'esriSpatialRelIntersects',
      // post_2014 (a rezoning-ordinance number) is deliberately NOT requested: it is unreliable
      // outside PUDs and the model was printing it as if it established the district.
      outFields: 'zoneclassnew,title,subareatitle,file1url,file1title',
      returnGeometry: 'false'
    });
    const zones = (z.features || []).map(f => {
      const zi = zoneInfo(f.attributes.zoneclassnew);
      return {
        district: f.attributes.zoneclassnew,
        district_name: zi.district_name,
        // The code chapter (or adopting ordinance) that establishes this classification.
        code_url: zi.code_url,
        pud_title: f.attributes.title || undefined,
        subarea: f.attributes.subareatitle || undefined,
        pud_text_url: f.attributes.file1url || undefined
      };
    });
    const at = p.attributes;
    // Refresh the property details from Franklin County's live parcel service (current);
    // fall back to the City's imported attributes only if the county lookup is unavailable.
    const cty = await countyParcelDetails(at.PARCELID);
    const S = cty || at;
    const acres = (S.ACRES != null && S.ACRES !== '') ? +(+S.ACRES).toFixed(3)
                : (at.Shape__Area ? +(at.Shape__Area / 43560).toFixed(3) : undefined);
    const PCLASS_MAP = {R:'Residential', C:'Commercial', I:'Industrial', A:'Agricultural', E:'Exempt (government/institutional)', M:'Mineral', U:'Utility'};
    const result = {
      matched_address: S.SITEADDRESS || at.SITEADDRESS,
      found_via,
      resolved_place: resolved_place,
      parcel_id: at.PARCELID,
      auditor_link: auditorLink(at.PARCELID),
      zoning_map: zoningMapUrls(c.x, c.y),
      tax_district: S.CVTTXDSCRP || at.CVTTXDSCRP,
      school_district: S.SCHLDSCRP || at.SCHLDSCRP,
      zoning: zones.length ? zones : 'No Hilliard zoning polygon at this location — if tax_district is not CITY OF HILLIARD, the property is outside city zoning jurisdiction (contact Franklin County or the township).',
      property_details_from_county_auditor_data: {
        owner: [S.OWNERNME1, S.OWNERNME2].filter(Boolean).join(' & ') || undefined,
        parcel_size_acres: acres,
        legal_description_note: S.PRPRTYDSCRP3 || undefined,
        residence_year_built: S.RESYRBLT || undefined,
        last_transfer_date: S.SALEDATE ? new Date(S.SALEDATE).toISOString().slice(0,10) : undefined,
        last_transfer_price: (S.SALEPRICE || S.SALEPRICE === 0) ? S.SALEPRICE : undefined,
        property_class: PCLASS_MAP[S.PCLASS] || S.PCLASS || undefined,
        subdivision_or_condo: S.CNVYNAME || undefined,
        homestead_exemption: S.HOMSTD === 'Y' ? 'Yes' : (S.HOMSTD === 'N' ? 'No' : undefined),
        data_source: cty ? 'Franklin County Auditor live parcel records (current)' : 'City of Hilliard county-data import (may lag recent sales)',
        full_records_link: 'https://property.franklincountyauditor.com/_web/search/commonsearch.aspx?mode=address'
      },
      permit_history_link: 'https://hilliardoh.portal.opengov.com/search — resident can type the address under "Locations" to see every active and historical permit for this property',
      other_address_matches: feats.slice(1).map(f => f.attributes.SITEADDRESS),
      source: 'City of Hilliard GIS "Zoning Districts and PUDs" layer (maps.hilliardohio.gov) + Franklin County Auditor parcel data'
    };
    window.lastZoning = result;
    return result;
  }catch(e){
    return {error:'GIS lookup failed: ' + e.message};
  }
}

/* ---------- chat UI ---------- */
function addMsg(role, text, tagLabel){
  const wrap = document.getElementById('chatScroll');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  if(tagLabel){
    const t = document.createElement('span');
    t.className = 'tag'; t.textContent = tagLabel;
    div.appendChild(t);
    div.appendChild(document.createElement('br'));
  }
  renderBody(div, text, role);
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
}
function renderBody(div, text, role){
  const m = role === 'bot' ? text.match(/<<<LETTER>>>([\s\S]*?)<<<END LETTER>>>/) : null;
  if(!m){ div.appendChild(linkify(text)); return; }
  const before = text.slice(0, m.index).trim();
  const after = text.slice(m.index + m[0].length).trim();
  const body = m[1].trim();
  if(before){ div.appendChild(linkify(before)); }
  const box = document.createElement('div');
  box.className = 'letter';
  const lt = document.createElement('div');
  lt.className = 'lt'; lt.textContent = 'INFORMATIONAL ZONING SUMMARY';
  box.appendChild(lt);
  // Insert the zoning map where the letter's [ZONING MAP] marker appears (or at the end).
  const zm = (window.lastZoning && window.lastZoning.zoning_map) || null;
  const parts = body.split('[ZONING MAP]');
  box.appendChild(linkify(parts[0]));
  if(zm){ box.appendChild(zoningMapBlock(zm)); }
  if(parts.length > 1){ box.appendChild(linkify(parts.slice(1).join(''))); }
  div.appendChild(box);
  const btn = document.createElement('button');
  btn.className = 'printBtn';
  btn.textContent = 'Print / Save as PDF';
  btn.onclick = () => printLetter(body, zm);
  div.appendChild(btn);
  if(after){ div.appendChild(document.createElement('br')); div.appendChild(linkify(after)); }
}
// Small zoning map: the image links to this parcel on the live City Zone Lookup map,
// with a caption link to the full zoning map.
function zoningMapBlock(zm){
  const wrap = document.createElement('div');
  wrap.style.cssText = 'margin:8px 0';
  const a = document.createElement('a');
  a.href = zm.live_map_url; a.target = '_blank'; a.rel = 'noopener';
  a.title = 'Open this parcel on the live City zoning map';
  // The image is generated centered on the parcel, so a centered dot marks it exactly.
  a.style.cssText = 'position:relative;display:inline-block;line-height:0';
  const img = document.createElement('img');
  img.src = zm.image_url;
  // If the visitor's network blocks the GIS host, reload the image through the Worker proxy.
  img.onerror = function(){ if(!img.dataset.retried){ img.dataset.retried = '1'; img.src = gisViaProxy(zm.image_url); } };
  img.alt = 'Zoning map of the property — click to open the live City zoning map';
  img.style.cssText = 'display:block;max-width:100%;width:480px;border:1px solid #dde4ea;border-radius:6px';
  a.appendChild(img);
  const dot = document.createElement('span');
  dot.setAttribute('aria-hidden', 'true');
  dot.style.cssText = 'position:absolute;left:50%;top:50%;width:15px;height:15px;margin:-7.5px 0 0 -7.5px;'
    + 'border-radius:50%;background:#d93025;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.45);'
    + 'pointer-events:none;-webkit-print-color-adjust:exact;print-color-adjust:exact';
  a.appendChild(dot);
  wrap.appendChild(a);
  const cap = document.createElement('div');
  cap.style.cssText = 'font-size:11.5px;color:#5c6b78;margin-top:4px';
  cap.appendChild(document.createTextNode('The red dot marks the property. Click the map to open this parcel on the live City zoning map, or open the '));
  const full = document.createElement('a');
  full.href = zm.full_map_url; full.target = '_blank'; full.rel = 'noopener'; full.textContent = 'full Hilliard Zoning Map';
  cap.appendChild(full); cap.appendChild(document.createTextNode('.'));
  wrap.appendChild(cap);
  return wrap;
}
function printLetter(body, zm){
  const w = window.open('', '_blank');
  if(!w){ alert('Please allow pop-ups to print the letter.'); return; }
  let esc = body.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  // Convert markdown links to anchors first, protecting them with placeholders
  // so the bare-URL pass below can't double-wrap their href.
  const anchors = [];
  esc = esc.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (mm, label, url) => {
    anchors.push('<a href="' + recordHref(url) + '" target="_blank" rel="noopener">' + label + '</a>');
    return '\uE000' + (anchors.length - 1) + '\uE000';
  });
  esc = esc.replace(/(https?:\/\/[^\s<]+|(?:[a-z0-9-]+\.)+(?:gov|com|org|net)(?:\/[^\s<]*)?)/gi, (u) => {
    let trail = ''; const tm = u.match(URL_TRAIL);
    if(tm){ trail = u.slice(u.length - tm[0].length); u = u.slice(0, u.length - tm[0].length); }
    const href = recordHref(u.startsWith('http') ? u : 'https://' + u);
    return '<a href="' + href + '" target="_blank" rel="noopener">' + u + '</a>' + trail;
  });
  esc = esc.replace(/\uE000(\d+)\uE000/g, (mm, i) => anchors[+i]);
  // Zoning map: place it where the [ZONING MAP] marker is (or after the letter text).
  const hAttr = (s) => String(s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;');
  const dotCss = 'position:absolute;left:50%;top:50%;width:15px;height:15px;margin:-7.5px 0 0 -7.5px;border-radius:50%;'
    + 'background:#d93025;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.45);'
    + '-webkit-print-color-adjust:exact;print-color-adjust:exact';
  const mapHtml = zm ? ('<div style="margin:10px 0"><a href="' + hAttr(zm.live_map_url) + '" target="_blank" rel="noopener" style="position:relative;display:inline-block;line-height:0">'
    + '<img src="' + hAttr(zm.image_url) + '" alt="Zoning map of the property" style="display:block;max-width:100%;width:480px;border:1px solid #dde4ea;border-radius:6px">'
    + '<span aria-hidden="true" style="' + dotCss + '"></span></a>'
    + '<div style="font-family:-apple-system,\'Segoe UI\',Arial,sans-serif;font-size:11px;color:#5c6b78;margin-top:4px">The red dot marks the property. Click the map to open this parcel on the live City zoning map, or open the <a href="' + hAttr(zm.full_map_url) + '" target="_blank" rel="noopener">full Hilliard Zoning Map</a>.</div></div>') : '';
  const content = (esc.indexOf('[ZONING MAP]') >= 0)
    ? '<pre>' + esc.replace('[ZONING MAP]', '</pre>' + mapHtml + '<pre>') + '</pre>'
    : '<pre>' + esc + '</pre>' + mapHtml;
  w.document.write('<!DOCTYPE html><html><head><title>Informational Zoning Summary</title><style>'
    + "body{font-family:Georgia,'Times New Roman',serif;color:#1d2b36;max-width:7.2in;margin:40px auto;line-height:1.55;font-size:13.5px}"
    + ".lh{border-bottom:3px solid #1b3a5c;padding-bottom:12px;margin-bottom:6px}"
    + ".lh h1{font-family:-apple-system,'Segoe UI',Arial,sans-serif;color:#1b3a5c;font-size:22px;margin:0}"
    + ".lh .sub{font-family:-apple-system,'Segoe UI',Arial,sans-serif;color:#5c6b78;font-size:11.5px;margin-top:3px}"
    + ".banner{background:#fdf3dc;border:1px solid #ecd9a0;padding:8px 12px;font-family:-apple-system,'Segoe UI',Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:.3px;margin:14px 0;text-transform:uppercase;color:#7a5a00}"
    + 'pre{white-space:pre-wrap;font:inherit;margin:0}'
    + '@media print{.noprint{display:none}}'
    + '</style></head><body>'
    + '<div class="lh"><h1>City of Hilliard, Ohio</h1><div class="sub">Hilliard Assistant &middot; hilliardohio.gov &middot; (614) 876-7361 &middot; 3800 Municipal Way, Hilliard, OH 43026</div></div>'
    + '<div class="banner">Informational zoning summary &mdash; not an official Zoning Verification Letter</div>'
    + content
    + '<p class="noprint"><button onclick="window.print()">Print</button></p>'
    + '</body></html>');
  w.document.close();
}
/* Staff mode — toggle under the message box (or ?staff=1 in the URL) makes OpenGov record
   numbers link to the internal workflow detail view instead of the public record page.
   Remembered per browser in localStorage; residents who leave it off are unaffected. */
let STAFF_MODE = (function(){
  try{
    const p = new URLSearchParams(location.search);
    if(p.has('staff')){ const on = p.get('staff') !== '0'; localStorage.setItem('staffMode', on ? '1' : '0'); return on; }
    return localStorage.getItem('staffMode') === '1';
  }catch(e){ return false; }
})();
const PORTAL_REC = /^https:\/\/hilliardoh\.portal\.opengov\.com\/records\/(\d+)/i;
const WORKFLOW_REC = /^https:\/\/hilliardoh\.workflow\.opengov\.com\/#\/explore\/records\/(\d+)\/details/i;
function recordHref(href){
  const s = String(href || '');
  if(STAFF_MODE){
    const m = PORTAL_REC.exec(s);
    return m ? ('https://hilliardoh.workflow.opengov.com/#/explore/records/' + m[1] + '/details') : s;
  }
  const w = WORKFLOW_REC.exec(s);
  return w ? ('https://hilliardoh.portal.opengov.com/records/' + w[1]) : s;
}
function paintStaffMode(){
  try{
    const b = document.getElementById('staffBadge');
    if(b) b.style.display = STAFF_MODE ? 'inline-block' : 'none';
    const t = document.getElementById('staffToggle');
    if(t) t.checked = STAFF_MODE;
  }catch(e){}
}
function setStaffMode(on){
  STAFF_MODE = !!on;
  try{ localStorage.setItem('staffMode', STAFF_MODE ? '1' : '0'); }catch(e){}
  paintStaffMode();
  // Re-point links already on screen so the toggle applies to the current conversation.
  try{
    document.querySelectorAll('#chatScroll a[href]').forEach(a => { a.href = recordHref(a.href); });
  }catch(e){}
}
paintStaffMode();
// Render markdown links [label](url) as clickable labels, and auto-link bare URLs elsewhere.
function linkify(text){
  const frag = document.createDocumentFragment();
  const md = /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g;
  let last = 0, m;
  while((m = md.exec(text)) !== null){
    frag.appendChild(autolink(text.slice(last, m.index)));
    const a = document.createElement('a');
    a.href = recordHref(m[2]); a.textContent = m[1]; a.target = '_blank'; a.rel = 'noopener';
    frag.appendChild(a);
    last = m.index + m[0].length;
  }
  frag.appendChild(autolink(text.slice(last)));
  return frag;
}
// Match a full http(s) URL (any chars incl. dots in the path, up to whitespace)
// OR a bare domain ending in gov/com/org/net with an optional path.
const URL_RE = /(https?:\/\/[^\s<]+|(?:[a-z0-9-]+\.)+(?:gov|com|org|net)(?:\/[^\s<]*)?)/gi;
// Trailing punctuation that is almost never part of a URL (sentence enders).
const URL_TRAIL = /[)\].,;:!?'"]+$/;
function autolink(text){
  const frag = document.createDocumentFragment();
  let last = 0, m;
  URL_RE.lastIndex = 0;
  while((m = URL_RE.exec(text)) !== null){
    frag.appendChild(document.createTextNode(text.slice(last, m.index)));
    let raw = m[1], trail = '';
    const tm = raw.match(URL_TRAIL);
    if(tm){ trail = raw.slice(raw.length - tm[0].length); raw = raw.slice(0, raw.length - tm[0].length); }
    const a = document.createElement('a');
    a.href = recordHref(raw.startsWith('http') ? raw : 'https://' + raw);
    a.textContent = raw; a.target = '_blank'; a.rel = 'noopener';
    frag.appendChild(a);
    if(trail) frag.appendChild(document.createTextNode(trail));
    last = m.index + m[1].length;
  }
  frag.appendChild(document.createTextNode(text.slice(last)));
  return frag;
}
function ask(q){ document.getElementById('chatInput').value = q; send(); }

async function send(){
  const input = document.getElementById('chatInput');
  const q = input.value.trim();
  if(!q) return;
  input.value = '';
  document.getElementById('chips').style.display = 'none';
  addMsg('user', q);
  const matched = matchTopics(q);
  const topicName = categorize(q, matched);

  // Fixed-answer topic: reply instantly, no backend call
  const fixed = matched.find(t => t.mode === 'fixed');
  if(fixed){
    addMsg('bot', fixed.body, 'City notice — ' + fixed.name);
    postLog(q, fixed.body, fixed.name, 'Custom');
    return;
  }

  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  const typing = document.createElement('div');
  typing.className = 'typing'; typing.textContent = 'Hilliard Assistant is typing…';
  document.getElementById('chatScroll').appendChild(typing);

  const guides = matched.filter(t => t.mode === 'guide').map(t => '[' + t.name + '] ' + t.body);

  try{
    history.push({role:'user', content: q});
    let messages = history.slice(-12);
    let answer = null, usedGIS = false;
    for(let turn = 0; turn < 4; turn++){
      const resp = await fetch(BACKEND + '/api/chat', {
        method: 'POST',
        headers: {'content-type': 'application/json'},
        body: JSON.stringify({messages, guides})
      });
      const data = await resp.json();
      if(!resp.ok){
        typing.remove();
        addMsg('bot', 'Sorry — ' + ((data.error && data.error.message) || 'I hit a connection problem. Please try again.'));
        history.pop();
        return;
      }
      if(data.stop_reason === 'tool_use'){
        usedGIS = true;
        typing.textContent = 'Checking the city zoning map…';
        messages = messages.concat([{role:'assistant', content: data.content}]);
        const results = [];
        for(const block of data.content.filter(b => b.type === 'tool_use')){
          // The keyless GIS tool runs in the browser; the P&Z project search is served by the
          // worker's /api/projects endpoint; anything else is handled server-side by the worker.
          let out;
          if(block.name === 'lookup_zoning') out = await lookupZoning(block.input && block.input.address);
          else if(block.name === 'search_projects') out = await searchProjectsViaWorker(block.input && block.input.query);
          else out = { error: 'handled server-side' };
          results.push({type:'tool_result', tool_use_id: block.id, content: JSON.stringify(out)});
        }
        messages = messages.concat([{role:'user', content: results}]);
        continue;
      }
      answer = data.content.filter(b => b.type === 'text').map(b => b.text).join('');
      break;
    }
    typing.remove();
    if(answer === null){ answer = 'Sorry — I couldn\'t finish that lookup. Please try again.'; }
    history.push({role:'assistant', content: answer});
    addMsg('bot', answer, usedGIS ? 'Checked the official city zoning map' : null);
    postLog(q, answer, topicName, (guides.length ? 'AI + custom' : 'AI') + (usedGIS ? ' + GIS' : ''));
  }catch(err){
    typing.remove();
    addMsg('bot', 'Sorry — I couldn\'t reach the answer service. Please check your connection and try again, or call the City at (614) 876-7361.');
    history.pop();
  }finally{
    btn.disabled = false;
  }
}

function postLog(question, answer, topic, source){
  fetch(BACKEND + '/api/log', {
    method: 'POST', headers: {'content-type': 'application/json'},
    body: JSON.stringify({question, answer, topic, source})
  }).catch(() => {});
}

document.getElementById('chatInput').addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});

/* ---------- boot ---------- */
addMsg('bot', "Hi! I'm the Hilliard Assistant. I can answer questions about City of Hilliard services, rules, and contacts — trash pickup, permits, parks, taxes, city code, and more. For any Hilliard address I can also look up its zoning district and property details like lot size, owner, and year built from official city and county records. What can I help you with?");
loadTopics();
if(BACKEND.includes('YOUR-WORKER-NAME')){
  addMsg('bot', 'Setup note: the BACKEND constant at the top of this file has not been set to your Cloudflare Worker URL yet. Residents will not be able to get answers until it is.');
}
